name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore JobHunter.AI.slnx

    - name: Build
      run: dotnet build JobHunter.AI.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test JobHunter.AI.slnx --no-build --configuration Release --verbosity normal