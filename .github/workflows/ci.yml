name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: jobhunter_integration
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobhunter_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JOBHUNTER_INTEGRATION_DB: "Host=127.0.0.1;Port=55432;Database=jobhunter_integration;Username=postgres;Password=integration-only"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore JobHunter.AI.slnx

      - name: Build
        run: dotnet build JobHunter.AI.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test JobHunter.AI.slnx --no-build --configuration Release --verbosity normal