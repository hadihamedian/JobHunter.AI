<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobHunter.AI</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet" />
</head>
<body>
<div id="app">Loading...</div>
<script src="_framework/blazor.webassembly.js"></script>
<script>
    window.openPrintView = function(content) {
        const win = window.open('', '_blank');
        if (!win) {
            alert('Please allow popups for this site to download PDF.');
            return;
        }
        win.document.write(`
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <title>Resume</title>
                    <style>
                        * { margin: 0; padding: 0; box-sizing: border-box; }

                        body {
                            font-family: 'Georgia', serif;
                            font-size: 11pt;
                            color: #1a1a1a;
                            background: #fff;
                            padding: 0;
                        }

                        .page {
                            max-width: 210mm;
                            margin: 0 auto;
                            padding: 20mm 18mm;
                            min-height: 297mm;
                        }

                        /* print settings */
                        @media print {
                            body { background: white; }
                            .page { padding: 15mm 15mm; }
                            .no-print { display: none; }
                        }

                        /* دکمه print */
                        .print-bar {
                            position: fixed;
                            top: 0;
                            left: 0;
                            right: 0;
                            background: #1a1a1a;
                            color: #fff;
                            padding: 10px 20px;
                            display: flex;
                            align-items: center;
                            justify-content: space-between;
                            font-family: 'Inter', sans-serif;
                            font-size: 13px;
                            z-index: 100;
                        }

                        .print-btn {
                            background: #6366f1;
                            color: white;
                            border: none;
                            padding: 7px 16px;
                            border-radius: 6px;
                            font-size: 13px;
                            cursor: pointer;
                            font-family: inherit;
                        }
                        .print-btn:hover { background: #4f46e5; }

                        .close-btn {
                            background: transparent;
                            color: #888;
                            border: 1px solid #444;
                            padding: 7px 16px;
                            border-radius: 6px;
                            font-size: 13px;
                            cursor: pointer;
                            font-family: inherit;
                        }
                        .close-btn:hover { color: #fff; border-color: #666; }

                        .content-area {
                            margin-top: 52px;
                        }

                        /* متن رزومه */
                        .resume-text { font-family: 'Georgia', serif; font-size: 10.5pt; line-height: 1.6; color: #1a1a1a; }
                        .resume-text h2 {
                            font-size: 13pt; font-weight: 700; margin: 16px 0 6px;
                            border-bottom: 1px solid #1a1a1a; padding-bottom: 2px;
                            text-transform: uppercase; letter-spacing: .03em;
                        }
                        .resume-text h2:first-of-type { margin-top: 0; }
                        .resume-text h3 { font-size: 11pt; font-weight: 700; margin: 10px 0 2px; }
                        .resume-text p { margin: 4px 0; }
                        .resume-text ul { margin: 4px 0 8px 18px; padding: 0; }
                        .resume-text li { margin-bottom: 2px; }
                        .resume-text strong { font-weight: 700; }
                    </style>
                </head>
                <body>
                    <div class="print-bar no-print">
                        <span>Resume Preview — Press Print to save as PDF</span>
                        <div style="display:flex;gap:8px">
                            <button class="close-btn" onclick="window.close()">Close</button>
                            <button class="print-btn" onclick="window.print()">🖨 Print / Save PDF</button>
                        </div>
                    </div>

                    <div class="content-area">
                        <div class="page">
<!--                            <div class="resume-text">${content.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>-->
                                <div class="resume-text">${content}</div>
                        </div>
                    </div>
                </body>
                </html>
            `);
        win.document.close();
    };
</script>
</body>
</html>
